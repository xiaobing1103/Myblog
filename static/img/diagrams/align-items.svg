<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title"><title id="title">align-items：交叉轴对齐（row）</title><rect width="800" height="420" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">align-items：交叉轴对齐（row）</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><text x="24" y="112" font-size="15" fill="#23334f">flex-start</text><rect x="24" y="135" width="145" height="160" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="32" y="140" width="36" height="40" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="75" y="140" width="36" height="65" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="118" y="140" width="36" height="85" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="179" y="112" font-size="15" fill="#23334f">center</text><rect x="179" y="135" width="145" height="160" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="187" y="195" width="36" height="40" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="230" y="182.5" width="36" height="65" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="273" y="172.5" width="36" height="85" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="334" y="112" font-size="15" fill="#23334f">flex-end</text><rect x="334" y="135" width="145" height="160" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="342" y="250" width="36" height="40" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="385" y="225" width="36" height="65" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="428" y="205" width="36" height="85" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="489" y="112" font-size="15" fill="#23334f">stretch</text><rect x="489" y="135" width="145" height="160" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="497" y="140" width="36" height="150" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="540" y="140" width="36" height="150" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="583" y="140" width="36" height="150" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="644" y="112" font-size="15" fill="#23334f">baseline</text><rect x="644" y="135" width="145" height="160" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="652" y="200" width="36" height="40" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="695" y="175" width="36" height="65" rx="5" fill="#dce8ff" stroke="#5c77a2"/><rect x="738" y="155" width="36" height="85" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="28" y="350" font-size="15" fill="#23334f">stretch 对交叉轴尺寸为 auto 的项目拉伸；baseline 按文字基线对齐。</text></g></svg>