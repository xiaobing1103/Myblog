<svg xmlns="http://www.w3.org/2000/svg" width="800" height="425" viewBox="0 0 800 425" role="img" aria-labelledby="title"><title id="title">常见排序算法复杂度</title><rect width="800" height="425" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">常见排序算法复杂度</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><text x="35" y="110" font-size="17" fill="#23334f">算法</text><text x="225" y="110" font-size="17" fill="#23334f">平均时间</text><text x="415" y="110" font-size="17" fill="#23334f">最坏时间</text><text x="605" y="110" font-size="17" fill="#23334f">额外空间</text><rect x="25" y="123" width="750" height="35" rx="5" fill="#e8effc" stroke="#5c77a2"/><text x="35" y="148" font-size="16" fill="#23334f">冒泡</text><text x="225" y="148" font-size="16" fill="#23334f">O(n²)</text><text x="415" y="148" font-size="16" fill="#23334f">O(n²)</text><text x="605" y="148" font-size="16" fill="#23334f">O(1)</text><rect x="25" y="160" width="750" height="35" rx="5" fill="#fff" stroke="#5c77a2"/><text x="35" y="185" font-size="16" fill="#23334f">选择</text><text x="225" y="185" font-size="16" fill="#23334f">O(n²)</text><text x="415" y="185" font-size="16" fill="#23334f">O(n²)</text><text x="605" y="185" font-size="16" fill="#23334f">O(1)</text><rect x="25" y="197" width="750" height="35" rx="5" fill="#e8effc" stroke="#5c77a2"/><text x="35" y="222" font-size="16" fill="#23334f">插入</text><text x="225" y="222" font-size="16" fill="#23334f">O(n²)</text><text x="415" y="222" font-size="16" fill="#23334f">O(n²)</text><text x="605" y="222" font-size="16" fill="#23334f">O(1)</text><rect x="25" y="234" width="750" height="35" rx="5" fill="#fff" stroke="#5c77a2"/><text x="35" y="259" font-size="16" fill="#23334f">快速</text><text x="225" y="259" font-size="16" fill="#23334f">O(n log n)</text><text x="415" y="259" font-size="16" fill="#23334f">O(n²)</text><text x="605" y="259" font-size="16" fill="#23334f">O(log n)*</text><rect x="25" y="271" width="750" height="35" rx="5" fill="#e8effc" stroke="#5c77a2"/><text x="35" y="296" font-size="16" fill="#23334f">归并</text><text x="225" y="296" font-size="16" fill="#23334f">O(n log n)</text><text x="415" y="296" font-size="16" fill="#23334f">O(n log n)</text><text x="605" y="296" font-size="16" fill="#23334f">O(n)</text><rect x="25" y="308" width="750" height="35" rx="5" fill="#fff" stroke="#5c77a2"/><text x="35" y="333" font-size="16" fill="#23334f">堆排序</text><text x="225" y="333" font-size="16" fill="#23334f">O(n log n)</text><text x="415" y="333" font-size="16" fill="#23334f">O(n log n)</text><text x="605" y="333" font-size="16" fill="#23334f">O(1)</text><text x="30" y="395" font-size="14" fill="#23334f">*快速排序空间为平均递归栈；不平衡划分时可能退化到 O(n)。</text></g></svg>