<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title"><title id="title">子元素的顶部外边距</title><rect width="800" height="420" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">子元素的顶部外边距</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><text x="80" y="125" font-size="17" fill="#23334f">父元素没有 border / padding，未建立独立 BFC</text><rect x="80" y="160" width="620" height="145" rx="5" fill="#dcefdc" stroke="#5c77a2"/><rect x="100" y="160" width="580" height="145" rx="5" fill="#ffe1df" stroke="#5c77a2"/><text x="130" y="220" font-size="17" fill="#23334f">子元素 height: 100px</text><text x="130" y="255" font-size="17" fill="#23334f">margin-top: 10px 可与父元素的外边距合并</text><text x="80" y="350" font-size="17" fill="#23334f">外边距位于父元素外侧；图中尺寸仅为示意。</text></g></svg>