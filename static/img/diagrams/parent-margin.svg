<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title"><title id="title">父元素高度与 BFC</title><rect width="800" height="420" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">父元素高度与 BFC</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><rect x="55" y="140" width="310" height="120" rx="5" fill="#dcefdc" stroke="#5c77a2"/><text x="75" y="180" font-size="17" fill="#23334f">默认情况</text><text x="75" y="215" font-size="17" fill="#23334f">父高度 100px</text><rect x="420" y="120" width="320" height="140" rx="5" fill="#dcefdc" stroke="#5c77a2"/><text x="440" y="165" font-size="17" fill="#23334f">建立 BFC：overflow: hidden</text><text x="440" y="205" font-size="17" fill="#23334f">包含子元素顶部外边距</text><text x="440" y="235" font-size="17" fill="#23334f">父高度 110px</text><text x="55" y="320" font-size="17" fill="#23334f">也可使用 display: flow-root 建立 BFC，而不裁切溢出内容。</text></g></svg>