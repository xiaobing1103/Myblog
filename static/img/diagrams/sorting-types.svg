<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title"><title id="title">常见排序算法分类</title><rect width="800" height="420" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">常见排序算法分类</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><rect x="30" y="115" width="350" height="210" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="50" y="153" font-size="22" fill="#23334f">比较排序</text><text x="50" y="200" font-size="17" fill="#23334f">冒泡 · 选择 · 插入</text><text x="50" y="240" font-size="17" fill="#23334f">归并 · 堆排序 · 快速排序</text><rect x="420" y="115" width="350" height="210" rx="5" fill="#dcefdc" stroke="#5c77a2"/><text x="440" y="153" font-size="22" fill="#23334f">非比较排序</text><text x="440" y="200" font-size="17" fill="#23334f">计数排序 · 桶排序 · 基数排序</text><text x="440" y="250" font-size="17" fill="#23334f">利用值域、位数等额外信息</text><text x="30" y="370" font-size="15" fill="#23334f">比较排序在一般情况下需要 Ω(n log n) 次比较；非比较排序依赖数据条件。</text></g></svg>