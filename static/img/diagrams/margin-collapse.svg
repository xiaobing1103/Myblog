<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title"><title id="title">垂直外边距合并</title><rect width="800" height="420" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">垂直外边距合并</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><rect x="80" y="100" width="420" height="70" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="100" y="143" font-size="17" fill="#23334f">上方块：margin-bottom = 30px</text><text x="530" y="195" font-size="17" fill="#23334f">实际间隔 = 30px</text><rect x="80" y="210" width="420" height="70" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="100" y="253" font-size="17" fill="#23334f">下方块：margin-top = 20px</text><text x="80" y="330" font-size="17" fill="#23334f">相邻普通块的正外边距合并后取较大值，而不是 30 + 20。</text></g></svg>