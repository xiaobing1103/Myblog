<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title"><title id="title">flex-wrap：项目换行方式（row）</title><rect width="800" height="420" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">flex-wrap：项目换行方式（row）</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><text x="30" y="110" font-size="17" fill="#23334f">nowrap</text><rect x="30" y="130" width="230" height="190" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="38" y="150" width="47" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="53" y="183" font-size="17" fill="#23334f">1</text><rect x="92" y="150" width="47" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="107" y="183" font-size="17" fill="#23334f">2</text><rect x="146" y="150" width="47" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="161" y="183" font-size="17" fill="#23334f">3</text><rect x="200" y="150" width="47" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="215" y="183" font-size="17" fill="#23334f">4</text><text x="285" y="110" font-size="17" fill="#23334f">wrap</text><rect x="285" y="130" width="230" height="190" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="293" y="150" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="308" y="183" font-size="17" fill="#23334f">1</text><rect x="401" y="150" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="416" y="183" font-size="17" fill="#23334f">2</text><rect x="293" y="225" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="308" y="258" font-size="17" fill="#23334f">3</text><rect x="401" y="225" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="416" y="258" font-size="17" fill="#23334f">4</text><text x="540" y="110" font-size="17" fill="#23334f">wrap-reverse</text><rect x="540" y="130" width="230" height="190" rx="5" fill="#fff" stroke="#5c77a2"/><rect x="548" y="225" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="563" y="258" font-size="17" fill="#23334f">1</text><rect x="656" y="225" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="671" y="258" font-size="17" fill="#23334f">2</text><rect x="548" y="150" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="563" y="183" font-size="17" fill="#23334f">3</text><rect x="656" y="150" width="98" height="55" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="671" y="183" font-size="17" fill="#23334f">4</text><text x="28" y="370" font-size="15" fill="#23334f">nowrap 可按 flex-shrink 缩小项目；wrap-reverse 反转行堆叠方向。</text></g></svg>