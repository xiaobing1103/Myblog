<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title"><title id="title">实例的隐式原型</title><rect width="800" height="420" rx="12" fill="#f8faff"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="23" fill="#23334f">实例的隐式原型</text><text x="28" y="68" font-size="13" fill="#23334f">根据正文重绘的示意图，非原始截图</text><rect x="35" y="150" width="170" height="70" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="48" y="192" font-size="15" fill="#23334f">实例 obj</text><text x="210" y="192" font-size="22" fill="#23334f">→</text><rect x="230" y="150" width="170" height="70" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="243" y="192" font-size="15" fill="#23334f">Foo.prototype</text><text x="405" y="192" font-size="22" fill="#23334f">→</text><rect x="425" y="150" width="170" height="70" rx="5" fill="#dce8ff" stroke="#5c77a2"/><text x="438" y="192" font-size="15" fill="#23334f">Object.prototype</text><text x="35" y="290" font-size="16" fill="#23334f">Object.getPrototypeOf(obj) === Foo.prototype（通过 new Foo 创建时）。</text></g></svg>